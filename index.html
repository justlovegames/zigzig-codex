const DATA=JSON.parse(document.getElementById('dataset').textContent),view=document.getElementById('view');const sections={essentials:['Master codes & essentials','🔑','Master codes, Rare Candy, Master Balls and more'],pokemon:['All Pokémon','🌿','All 386 Pokémon encounter codes'],levels:['Level modifiers','⚡','Wild Pokémon level modifiers'],natures:['Nature modifiers','✦','25 nature modifiers']};let tab='home',category='pokemon',sort=localStorage.getItem('zigzig-sort')||'az',query='',saved=[];try{saved=JSON.parse(localStorage.getItem('zigzig-saved-v2')||'[]')}catch(e){}const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function key(cat,item){return cat+':'+(cat==='pokemon'?item.dex:item.name+'|'+item.meta)}function persist(){localStorage.setItem('zigzig-saved-v2',JSON.stringify(saved))}function navigate(t,c){tab=t;if(c)category=c;query='';render();scrollTo({top:0,behavior:'instant'})}function tile(cat){const [name,icon,desc]=sections[cat];return `<button class="tile" data-open="${cat}"><span class="emoji">${icon}</span><span><strong>${name}</strong><br><small>${desc}</small></span></button>`}function home(){return `<section class="hero"><div class="eyebrow">Your retro gaming companion</div><h1>Every code.<br>One place.</h1><p>Fast, organised cheat codes, ready when you need them. Built for Pokémon Emerald on GBA emulators.</p><span class="chip">386 Pokémon · Offline-ready</span></section><h2>Explore the codex</h2><div class="tilegrid">${['pokemon','essentials','levels','natures'].map(tile).join('')}</div><button class="wide" data-tabgo="saved"><span><strong>☆ Your saved codes</strong><br><span class="subtitle">Quick access to your favourites</span></span><span>→</span></button><div class="notice"><strong>Before using cheats</strong><br>Back up your save. Codes are community-sourced and have not all been verified against every Emerald ROM revision. Pokémon encounters use CodeBreaker; other codes may u avedPage(){let a=[];for(const cat of Object.keys(DATA))for(const item of DATA[cat])if(saved.includes(key(cat,item)))a.push({cat,item});return `<div class="eyebrow">Your collection</div><h1>Saved codes ☆</h1><p>Your favourites stay on this device, so you can get back to them quickly.</p>${a.length?a.map(x=>entry(x.cat,x.item)).join(''):'<div class="notice">No saved codes yet. Open any code and tap ☆ Save to add it here.</div>'}`}
function render(){view.innerHTML=tab==='home'?home():tab==='library'?(category==='root'?library():categoryPage()):savedPage();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}function findItem(id){for(const cat of Object.keys(DATA))for(const item of DATA[cat])if(key(cat,item)===id)return item;return null}document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;if(tab==='library')category='root';query='';render();scrollTo(0,0)}else if(b.dataset.tabgo){navigate(b.dataset.tabgo,b.dataset.tabgo==='library'?'root':null)}else if(b.dataset.open){navigate('library',b.dataset.open)}else if(b.dataset.sort){sort=b.dataset.sort;localStorage.setItem('zigzig-sort',sort);render()}else if(b.dataset.fav){let id=b.dataset.fav;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();let d=b.closest('details');let open=d?.open;render();if(tab!=='saved'&&open){let ds=[...document.querySelectorAll('details')];let item=findItem(id);let index=DATA[category]?.findIndex(x=>key(category,x)===id);if(index>=0&&ds[index])ds[index].open=true}}else if(b.dataset.copy){let item=findItem(b.dataset.copy);if(!item)return;try{await navigator.clipboard.writeText(item.code);b.textContent='✓ Copied!'}catch(err){let ta=document.createElement('textarea');ta.value=item.code;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();b.textContent=ok?'✓ Copied!':'Select the code above to copy'}}});document.addEventListener('input',e=>{if(e.target.id!=='search')return;query=e.target.value;let a=[...DATA[category]];if(category==='pokemon')a.sort((x,y)=>sort==='dex'?x.dex-y.dex:x.name.localeCompare(y.name));a=a.filter(x=>x.name.toLowerCase().includes(query.toLowerCase())||(category==='pokemon'&&String(x.dex)===query.trim()));document.getElementById('results').innerHTML=a.map(x=>entry(category,x)).join('')||'<div class="empty">No matching codes f
